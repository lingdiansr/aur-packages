# main 合并后发布发生变更的 AUR 包；手动触发时发布全部包。
# 自动模式从 GitHub push 的 before..sha 范围解析包目录，包内的 install、hook、
# 启动脚本和本地 source 与 PKGBUILD/.SRCINFO 一样会触发发布。
name: 发布到 AUR(合并后)

on:
  push:
    branches: [main]
    paths:
      - "*/**"
      - "!scripts/**"
      - "!.github/**"
      - "!LICENSES/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: 发布到 AUR
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: 安装工具
        run: pacman -Syu --noconfirm --needed openssh git jq
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 计算待发布包
        id: packages
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # 收集所有含 PKGBUILD+.SRCINFO 的包目录
          select_all() {
            for pkgdir in */; do
              local pkg="${pkgdir%/}"
              [[ -f "$pkgdir/PKGBUILD" && -f "$pkgdir/.SRCINFO" ]] || continue
              selected["$pkg"]=1
            done
          }

          # 从文件列表收集所属的包目录
          select_from_files() {
            local path pkg
            while IFS= read -r path; do
              [[ "$path" == */* ]] || continue
              pkg="${path%%/*}"
              [[ -f "$pkg/PKGBUILD" && -f "$pkg/.SRCINFO" ]] || continue
              selected["$pkg"]=1
            done
          }

          declare -A selected=()
          changed_files=""

          if [[ "$MANUAL" == true ]]; then
            select_all
          else
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              # 分支首次推送:整个 head 树都是新的
              changed_files="$(git ls-tree -r --name-only "$GITHUB_SHA" 2>/dev/null || true)"
            else
              changed_files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || true)"
            fi

            if [[ -n "$changed_files" ]]; then
              select_from_files <<< "$changed_files"
            else
              # 对比失败(force push、浅历史、对象缺失)时退回发布全部:
              # publish.sh 幂等,多发布几个包没有代价,漏发布才是问题
              echo "无法确定 $BEFORE..$GITHUB_SHA 的变更范围,改为发布全部包。" >&2
              select_all
            fi
          fi

          if ((${#selected[@]} == 0)); then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "has_packages=true"
            echo "packages<<EOF"
            printf '%s\n' "${!selected[@]}" | sort
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 发布有变更的包
        shell: bash
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_USER_NAME: ${{ secrets.AUR_USER_NAME }}
          AUR_USER_EMAIL: ${{ secrets.AUR_USER_EMAIL }}
          HAS_PACKAGES: ${{ steps.packages.outputs.has_packages }}
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: |
          if [[ "$HAS_PACKAGES" != true ]]; then
            echo "没有需要发布的包"
            exit 0
          fi
          if [[ -z "${AUR_SSH_KEY:-}" ]]; then
            echo "AUR_SSH_KEY 未配置,跳过发布"
            exit 0
          fi

          fail=0
          while IFS= read -r pkg; do
            scripts/smoke.sh "$pkg" || { echo "$pkg 冒烟测试未通过,跳过发布"; fail=1; continue; }
            scripts/publish.sh "$pkg"
          done <<< "$PACKAGES"
          exit "$fail"
