# 每日检查上游版本,自动更新 AUR 包
# 结构参考:https://github.com/zerx-lab/actions(.github/workflows/check-updates.yml)
# 版本检测用 nvchecker:https://nvchecker.readthedocs.io/
# 流程:check(nvchecker 对比 old.json) → update(改 PKGBUILD+构建验证+发 AUR) → commit(更新 old.json 并提交仓库)
#
# 两种运行模式:
#   - 直推模式(默认):检测到更新后直接推送 main 并发布 AUR
#   - PR 模式:检测到更新后开 PR(含 PKGBUILD 变更与 old.json 同步),
#     合并后由 publish-aur.yml 发布 AUR。手动触发用 input 显式指定,
#     定时任务由仓库变量 PR_MODE=true 控制
name: 检查并更新 AUR 包

on:
  schedule:
    - cron: "0 8 * * *" # 每日 UTC 08:00
  workflow_dispatch: # 支持手动触发
    inputs:
      pr_mode:
        description: 以 PR 模式运行(开 PR 代替直接推送,合并后再发布 AUR)
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  # 手动触发:input 显式指定;定时任务:仓库变量 PR_MODE 控制
  PR_MODE: ${{ inputs.pr_mode == true || (github.event_name == 'schedule' && vars.PR_MODE == 'true') }}

jobs:
  check:
    name: 检查上游更新
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      has_updates: ${{ steps.detect.outputs.has_updates }}
      matrix: ${{ steps.detect.outputs.matrix }}
      pr_mode: ${{ inputs.pr_mode == true || (github.event_name == 'schedule' && vars.PR_MODE == 'true') }}
    steps:
      - name: 安装工具
        run: pacman -Syu --noconfirm --needed nvchecker jq
      - name: Checkout
        uses: actions/checkout@v5
      - name: 运行 nvchecker 检查上游
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '[keys]\ngithub = "%s"\n' "$GITHUB_TOKEN" > keyfile.toml
          nvchecker --file nvchecker.toml --keyfile keyfile.toml
          echo "new.json:"
          cat new.json
      - name: 检测需要更新的包
        id: detect
        run: |
          updates="$(nvcmp --file nvchecker.toml --json || true)"
          echo "nvcmp: $updates"
          if [[ "$updates" == "[]" || -z "$updates" ]]; then
            echo "所有包均为最新"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            matrix="$(echo "$updates" | jq -c '{include: [.[] | {pkg: .name, version: .newver}]}')"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  update:
    name: 更新 ${{ matrix.pkg }}
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      # secrets 不能直接在 if 条件中引用,先用 env 求值布尔标志
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_KEY != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - name: 安装工具
        run: pacman -Syu --noconfirm --needed pacman-contrib openssh jq
      - name: Checkout
        uses: actions/checkout@v5
      - name: 建立构建用户
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder .
      - name: 更新包版本
        env:
          PKG: ${{ matrix.pkg }}
          VERSION: ${{ matrix.version }}
        run: |
          su -w PKG,VERSION builder -c 'scripts/update-version.sh "$PKG" "$VERSION"'
      - name: 构建验证
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          su -w PKG builder -c 'cd "$PKG" && CI=1 makepkg --syncdeps --noconfirm --noarchive'
      - name: 发布到 AUR
        if: ${{ env.PR_MODE == 'false' && env.HAS_AUR_KEY == 'true' }}
        env:
          PKG: ${{ matrix.pkg }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_USER_NAME: ${{ secrets.AUR_USER_NAME }}
          AUR_USER_EMAIL: ${{ secrets.AUR_USER_EMAIL }}
        run: scripts/publish.sh "$PKG"
      - name: 清理构建产物
        # 只保留 git 追踪的包脚本(PKGBUILD/.SRCINFO/install/本地 source),
        # 删除构建残留(src/ pkg/ 下载的源码归档等)。构建验证已在 CI 完成,
        # 下游提交不需要这些;用户本地 pull 后自行 makepkg 构建。
        run: git clean -fdX
      - name: 上传更新文件
        uses: actions/upload-artifact@v4
        with:
          name: updated-${{ matrix.pkg }}
          path: ${{ matrix.pkg }}/
          if-no-files-found: error

  commit:
    name: 提交更新到仓库
    needs: [check, update]
    if: needs.check.outputs.has_updates == 'true' && needs.check.outputs.pr_mode == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 下载更新文件
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
          pattern: updated-*
      - name: 恢复更新并同步 old.json
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
        run: |
          for d in .artifacts/updated-*; do
            [ -d "$d" ] || continue
            pkg="${d#.artifacts/updated-}"
            cp -a "$d/." "$pkg/"
            echo "restored $pkg"
          done
          MATRIX="$MATRIX" python3 - <<'PY'
          import json, os
          matrix = json.loads(os.environ['MATRIX'])
          with open('old.json') as f:
              old = json.load(f)
          for e in matrix.get('include', []):
              pkg = e['pkg']
              if os.path.isdir(f'.artifacts/updated-{pkg}'):
                  old['data'][pkg] = {'version': e['version']}
          with open('old.json', 'w') as f:
              json.dump(old, f, indent=2)
              f.write('\n')
          PY
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf .artifacts  # artifact 已恢复,删除副本防误提交
          git add .
          if git diff --cached --quiet; then
            echo "无变更,跳过提交"
          else
            git commit -m "更新 AUR 包到上游最新版本"
            git push
          fi

  pr:
    name: 创建更新 PR
    needs: [check, update]
    if: needs.check.outputs.has_updates == 'true' && needs.check.outputs.pr_mode == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 下载更新文件
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
          pattern: updated-*
      - name: 恢复更新并同步 old.json
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
        run: |
          for d in .artifacts/updated-*; do
            [ -d "$d" ] || continue
            pkg="${d#.artifacts/updated-}"
            cp -a "$d/." "$pkg/"
            echo "restored $pkg"
          done
          MATRIX="$MATRIX" python3 - <<'PY'
          import json, os
          matrix = json.loads(os.environ['MATRIX'])
          with open('old.json') as f:
              old = json.load(f)
          for e in matrix.get('include', []):
              pkg = e['pkg']
              if os.path.isdir(f'.artifacts/updated-{pkg}'):
                  old['data'][pkg] = {'version': e['version']}
          with open('old.json', 'w') as f:
              json.dump(old, f, indent=2)
              f.write('\n')
          PY
      - name: 创建分支并推送
        env:
          MATRIX: ${{ needs.check.outputs.matrix }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="auto-update/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          rm -rf .artifacts  # artifact 已恢复,删除副本防误提交
          git add .
          if git diff --cached --quiet; then
            echo "无变更,跳过"
            echo "BRANCH=" >> "$GITHUB_ENV"
          else
            git commit -m "更新 AUR 包到上游最新版本"
            git push origin "$branch"
            echo "BRANCH=$branch" >> "$GITHUB_ENV"
          fi
      - name: 创建 PR
        if: env.BRANCH != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.check.outputs.matrix }}
        run: |
          body="$(echo "$MATRIX" | jq -r '.include[] | "- **\(.pkg)**: \(.version)"')"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "更新 AUR 包到上游最新版本" \
            --body "检测到以下包有新版本:${body:+$'\n\n'$body}"
